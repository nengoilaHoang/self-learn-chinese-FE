name: Node.js CI/CD to Linux Server
on:
  push:
    branches: ["master"]
  # pull_request:
  #   branches: ["master", "dev"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    #==========build trên server của github===========
    - name: Checkout mã nguồn
      uses: actions/checkout@v4
      #môi trường ảo của git action
    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - name: Cài đặt dependencies
      run: npm ci
      #clean + install
    - name: Build ứng dụng React
      run: npm run build
    #==========Đẩy thư mục dist lên Server Linux bằng giao thức SFTP/SSH===========
    # --- THÊM BƯỚC NÀY VÀO TRƯỚC ---
    - name: Xóa sạch file cũ trên server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: azureuser
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Xóa toàn bộ file và thư mục con bên trong đích đến
          rm -rf /hostweb/self-learn-chinese/*
          # Đảm bảo vỏ thư mục đích vẫn tồn tại
          mkdir -p /hostweb/self-learn-chinese

    # --- SỬA LẠI BƯỚC CŨ CỦA BẠN THÀNH THẾ NÀY ---
    - name: Upload thư mục dist lên server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: azureuser
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "dist/*"
        target: "/hostweb/self-learn-chinese"
        strip_components: 1
        # Bỏ dòng rm: true đi vì Bước 1 đã xóa rồi
        timeout: 5m
